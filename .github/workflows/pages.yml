name: Hugo Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-pages-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          version=$(awk '$1 == "hugo" {print $2}' .tool-versions)
          release="https://github.com/gohugoio/hugo/releases/download/v$version"
          archive="hugo_${version}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --remote-name "$release/$archive"
          curl --fail --silent --show-error --location --remote-name "$release/hugo_${version}_checksums.txt"
          grep -F " $archive" "hugo_${version}_checksums.txt" | sha256sum --check --strict
          mkdir hugo-bin
          tar -xf "$archive" -C hugo-bin
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build and verify
        run: |
          hugo build --panicOnWarning
          python3 scripts/verify-site.py public

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
