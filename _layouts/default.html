<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% comment %}Jekyll SEO Tag 2.8 emits its JSON-LD script after the other metadata.{% endcomment %}
    {% capture seo_markup %}{% seo %}{% endcapture %}
    {{ seo_markup | split: '<script type="application/ld+json">' | first }}
    {% feed_meta %}
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site">
      <header class="site-header">
        {% if page.url == '/' %}
        <h1 class="site-name">{{ site.title | escape }}</h1>
        {% else %}
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        {% endif %}
        <nav aria-label="Main">
          <a href="{{ '/posts.html' | relative_url }}"{% if page.url == '/posts.html' %} aria-current="page"{% endif %}>Posts</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </nav>
      </header>

      <main id="main" tabindex="-1">
        {{ content }}
      </main>

      <footer class="site-footer">
        <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy policy</a>
        {% if site.github.private != true and site.github.license %}
        <p>This site is open source. {% github_edit_link "Improve this page" %}.</p>
        {% endif %}
      </footer>
    </div>
  </body>
</html>
